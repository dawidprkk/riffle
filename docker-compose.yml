# Infra is always up; the app services sit behind the `app` profile so that
# `make up` stays fast when the API and web app are run natively.
#
# Image tags are pinned deliberately — bump them in one place, on purpose.

name: riffle

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: riffle-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"   # Kafka API (host)
      - "18082:18082"   # HTTP proxy (host) — how the generator and tests publish
      - "9644:9644"     # admin
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: riffle-clickhouse
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CLICKHOUSE_DB: riffle
      CLICKHOUSE_USER: riffle
      CLICKHOUSE_PASSWORD: riffle
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"     # HTTP
      - "9000:9000"     # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Mount the file, not the directory: the entrypoint writes its own
      # default-user.xml into users.d and a read-only directory breaks startup.
      - ./clickhouse/config/users.d/riffle.xml:/etc/clickhouse-server/users.d/riffle.xml:ro

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: riffle-api
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: riffle
      CLICKHOUSE_PASSWORD: riffle
      CLICKHOUSE_DATABASE: riffle
      API_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    profiles: ["app"]
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: riffle-web
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  redpanda-data:
  clickhouse-data:
