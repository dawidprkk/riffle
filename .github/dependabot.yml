version: 2
updates:
  # Grouped: four separate action bumps in one week was noise, not signal.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /api
    schedule: { interval: monthly }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }

  # The Dockerfiles are a separate ecosystem from docker-compose. Without these
  # two blocks the base images (python, node, uv) are never checked at all.
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directory: /web
    schedule: { interval: monthly }
