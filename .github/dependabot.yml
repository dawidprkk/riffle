version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: uv
    directory: /api
    schedule: { interval: monthly }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
